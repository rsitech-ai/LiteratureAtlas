name: LiteratureAtlas

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

targets:
  LiteratureAtlas-macOS:
    type: application
    platform: macOS
    productName: LiteratureAtlas
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Sources/LiteratureAtlas
      - path: Resources/Shared/Assets.xcassets
        buildPhase: resources
      - path: Resources/macOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Prompts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: LiteratureAtlas
        PRODUCT_BUNDLE_IDENTIFIER: com.literatureatlas.app
        INFOPLIST_FILE: Resources/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/macOS/LiteratureAtlas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES

  LiteratureAtlas-iOS:
    type: application
    platform: iOS
    productName: LiteratureAtlas
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Sources/LiteratureAtlas
      - path: Resources/Shared/Assets.xcassets
        buildPhase: resources
      - path: Resources/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Prompts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: LiteratureAtlas
        PRODUCT_BUNDLE_IDENTIFIER: com.literatureatlas.app.ios
        INFOPLIST_FILE: Resources/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/LiteratureAtlas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO

schemes:
  LiteratureAtlas-macOS:
    build:
      targets:
        LiteratureAtlas-macOS: all
    run:
      config: Debug
    archive:
      config: Release

  LiteratureAtlas-iOS:
    build:
      targets:
        LiteratureAtlas-iOS: all
    run:
      config: Debug
    archive:
      config: Release
