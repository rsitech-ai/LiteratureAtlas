version = 1

# This annotation describes project-authored files in the sanitized repository.
# Dependency metadata and third-party tools retain their upstream terms.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Rafal Sikora"
SPDX-License-Identifier = "Apache-2.0"

# The DCO is copied verbatim under its own copy-and-distribute terms. It is not
# relicensed as project-authored Apache-2.0 material.
[[annotations]]
path = "DCO.txt"
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO-1.1"
