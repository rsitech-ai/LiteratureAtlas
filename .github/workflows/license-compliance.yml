name: License compliance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE / license metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"
      - name: Install pinned REUSE
        run: python -m pip install --disable-pip-version-check reuse==5.1.1
      - name: Verify license metadata
        run: reuse lint
