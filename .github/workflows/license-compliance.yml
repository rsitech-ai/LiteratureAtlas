name: License compliance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE / license metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install pinned REUSE
        run: python -m pip install --disable-pip-version-check reuse==5.1.1
      - name: Verify license metadata
        run: reuse lint
