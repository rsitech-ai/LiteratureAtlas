name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust format
        run: cargo fmt --manifest-path analytics/ffi/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path analytics/ffi/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path analytics/ffi/Cargo.toml
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Rust dependency audit
        run: cargo audit --file analytics/ffi/Cargo.lock

  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analytics and development dependencies
        run: python -m pip install --disable-pip-version-check -e "./analytics[dev]"
      - name: Python format
        run: python -m ruff format --check analytics scripts
      - name: Python lint
        run: python -m ruff check analytics scripts
      - name: Python tests
        run: python -m pytest analytics/tests -q
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.23"
      - name: Python lock consistency
        run: uv lock --check --project analytics

  apple-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust FFI for SwiftPM
        run: cargo build --manifest-path analytics/ffi/Cargo.toml --release
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Swift tests
        run: swift test
      - name: Swift release build
        run: swift build -c release
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify generated Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- LiteratureAtlas.xcodeproj
      - name: Build macOS App Store target
        run: >-
          xcodebuild -project LiteratureAtlas.xcodeproj
          -scheme LiteratureAtlas-macOS
          -configuration Release
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build iPadOS App Store target
        run: >-
          xcodebuild -project LiteratureAtlas.xcodeproj
          -scheme LiteratureAtlas-iOS
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Validate release configuration
        run: python3 scripts/validate_release_configuration.py
