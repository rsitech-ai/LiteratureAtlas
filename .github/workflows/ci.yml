name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust FFI (macOS)
        run: cargo build --manifest-path analytics/ffi/Cargo.toml --release
      - name: Swift tests (when FoundationModels is available)
        run: |
          cat > /tmp/foundationmodels_check.swift <<'SWIFT'
          import FoundationModels
          SWIFT

          if swiftc -typecheck /tmp/foundationmodels_check.swift >/dev/null 2>&1; then
            swift test
          else
            echo "FoundationModels is unavailable on this runner; skipping Swift tests."
          fi

