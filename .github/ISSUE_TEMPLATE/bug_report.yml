name: Bug report
description: Report a reproducible non-sensitive defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not attach research documents, private paths, credentials, Output data, or security findings.
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
