[project]
name = "literature-atlas-analytics"
version = "0.1.0"
description = "Local analytics pipeline for LiteratureAtlas"
authors = [{ name = "LiteratureAtlas" }]
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long is handled by line-length

[tool.uv]
# uv will manage the virtualenv; lock optional

[tool.uv.sources]
# Placeholders for local packages if added later
