[project]
name = "literature-atlas-analytics"
version = "0.1.0"
description = "Local analytics pipeline for LiteratureAtlas"
license = "MIT"
authors = [{ name = "LiteratureAtlas" }]
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.4.5",
  "numpy>=2.3.5",
  "pandas>=2.0",
  "scikit-learn>=1.8",
  "scipy>=1.16.3",
  "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long is handled by line-length

[tool.uv]
# uv will manage the virtualenv; lock optional

[tool.uv.sources]
# Placeholders for local packages if added later
